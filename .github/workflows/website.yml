name: Website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    outputs:
      alpha_bridge_version: ${{ steps.alpha-bridge.outputs.version }}
      alpha_bridge_sha256: ${{ steps.alpha-bridge.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Alpha.28+ desktop builds use this URL once to reach v0.5.0. Current
      # desktop builds update directly from GitHub Releases, so only verify
      # the bridge on the protected delivery push that changes it.
      - name: Verify committed alpha migration bridge
        id: alpha-bridge
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          manifest=website/public/releases/alpha/latest.json
          if [ "$GITHUB_EVENT_NAME" != 'push' ] || [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            exit 0
          fi
          if ! git diff --name-only "${EVENT_BEFORE}" "${GITHUB_SHA}" | grep -Fxq "${manifest}"; then
            exit 0
          fi
          if [ ! -f "${manifest}" ]; then
            echo "::error::alpha migration bridge was removed"
            exit 1
          fi
          canonical_manifest="${RUNNER_TEMP}/v0.5.0-latest.json"
          curl -fsSL \
            "https://github.com/hecatehq/hecate/releases/download/v0.5.0/latest.json" \
            --output "${canonical_manifest}"
          if ! cmp -s "${canonical_manifest}" "${manifest}"; then
            echo "::error::alpha migration bridge differs from the v0.5.0 Release manifest"
            exit 1
          fi
          version=$(jq -er '.version | select(. == "0.5.0")' "$manifest")
          sha256=$(sha256sum "$manifest" | awk '{print $1}')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Lint
        run: bun --bun run lint
        working-directory: website

      - name: Format check
        run: bun --bun run format:check
        working-directory: website

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: website

      - name: Build, browser, and accessibility tests
        run: bun --bun run test:e2e
        working-directory: website

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-browser-diagnostics-${{ github.run_attempt }}
          path: website/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify-alpha-migration-bridge:
    name: Verify alpha migration bridge
    needs: [build, deploy]
    if: needs.build.outputs.alpha_bridge_sha256 != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify alpha bridge is live
        env:
          WANT_SHA256: ${{ needs.build.outputs.alpha_bridge_sha256 }}
          WANT_VERSION: ${{ needs.build.outputs.alpha_bridge_version }}
        run: |
          set -euo pipefail
          live_manifest="${RUNNER_TEMP}/live-alpha-latest.json"
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -sf \
              "https://hecate.sh/releases/alpha/latest.json?cb=$(date +%s)" \
              --output "${live_manifest}"; then
              live_sha256=$(sha256sum "${live_manifest}" | awk '{print $1}')
              live_version=$(jq -r '.version // ""' "${live_manifest}" || true)
              if [ "$live_sha256" = "$WANT_SHA256" ]; then
                echo "alpha bridge live at hecate.sh, version=$live_version sha256=$live_sha256"
                exit 0
              fi
            else
              live_sha256=''
              live_version=''
            fi
            echo "waiting for alpha bridge (saw version=${live_version:-(none)} sha256=${live_sha256:-(none)}, want version=$WANT_VERSION sha256=$WANT_SHA256)"
            sleep 15
          done
          echo "::error::alpha bridge at hecate.sh did not advance to version=$WANT_VERSION sha256=$WANT_SHA256 within 10 min"
          exit 1
